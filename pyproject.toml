[project]
name = "agentic3d"
version = "1.1.3"
description = "Modellazione 3D di interni guidata da un agente, con norme italiane ed europee e SketchUp dal vivo"
readme = "README.md"
authors = [{ name = "Andrea Lucarelli" }]
license-files = ["LICENZA.md"]
requires-python = ">=3.12,<3.15"   # 3.15: alcune librerie non hanno ancora pacchetti pronti (prova del 23 ottobre 2026)
dependencies = [
    "pyyaml>=6",
    "ezdxf>=1.3",
    "pymupdf>=1.24",
    "mcp>=2.3,<3",
    "shapely>=2.1",
]

[project.scripts]
agentic3d = "agentic3d.__main__:principale"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic3d"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "agentic3d/skill"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
