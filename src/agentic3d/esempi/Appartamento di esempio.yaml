# Appartamento di prova (inventato, per verificare il costruttore di edifici): 100 m2 circa, sei stanze, pareti a rete
# con nodi a T, una parete a 45 gradi, finestre e porte su pareti e su stanze, arredi a scatole e forme libere.
# Sistema di riferimento: X est, Y nord, metri. Le pareti sono linee d'asse; le stanze sono al filo interno.
#   perimetro 10,0 x 7,0 m, pareti esterne da 0,30 m (filo interno a 0,15 m dall'asse), tramezzi da 0,10 m.

progetto: Appartamento di esempio
comune: Roma
destinazione: abitazione
intervento: nuova

edificio:
  soffitto: true
  piani:
    - id: Piano terra
      altezza_m: 2.70
      pareti:
        - {id: A, da: [0.0, 0.0], a: [8.8, 0.0], spessore_m: 0.30}        # sud
        - {id: P6, da: [8.8, 0.0], a: [10.0, 1.2], spessore_m: 0.30}      # angolo smussato a 45 gradi
        - {id: B, da: [10.0, 1.2], a: [10.0, 7.0], spessore_m: 0.30}      # est
        - {id: C, da: [10.0, 7.0], a: [0.0, 7.0], spessore_m: 0.30}       # nord
        - {id: D, da: [0.0, 7.0], a: [0.0, 0.0], spessore_m: 0.30}        # ovest
        - {id: P1, da: [0.0, 2.8], a: [5.5, 2.8], spessore_m: 0.10}       # tramezzi: nodi a T sulle pareti esterne
        - {id: P5, da: [5.5, 2.8], a: [10.0, 2.8], spessore_m: 0.10}
        - {id: P2, da: [5.5, 2.8], a: [5.5, 7.0], spessore_m: 0.10}
        - {id: P3, da: [3.2, 0.0], a: [3.2, 2.8], spessore_m: 0.10}
        - {id: P4, da: [6.5, 0.0], a: [6.5, 2.8], spessore_m: 0.10}

      stanze:
        - {id: Camera 1, tipo: camera_doppia, poligono_m: [[0.15, 0.15], [3.15, 0.15], [3.15, 2.75], [0.15, 2.75]]}
        - {id: Bagno, tipo: bagno, poligono_m: [[3.25, 0.15], [6.45, 0.15], [6.45, 2.75], [3.25, 2.75]]}
        - {id: Camera 2, tipo: camera_singola, poligono_m: [[6.55, 0.15], [8.738, 0.15], [9.85, 1.262], [9.85, 2.75], [6.55, 2.75]]}
        - {id: Soggiorno, tipo: soggiorno, poligono_m: [[0.15, 2.85], [5.45, 2.85], [5.45, 6.85], [0.15, 6.85]]}
        - {id: Cucina, tipo: cucina, poligono_m: [[5.55, 2.85], [9.85, 2.85], [9.85, 6.85], [5.55, 6.85]]}

      aperture:
        # sulle pareti (asse della parete, `da_m` dall'inizio, `lato` dove sta la stanza)
        - {id: Porta d'ingresso, tipo: porta, parete: D, lato: sinistra, da_m: 1.0, larghezza_m: 0.90, ingresso: true}
        - {id: Porta camera 1, tipo: porta, parete: P1, lato: sinistra, da_m: 0.8, larghezza_m: 0.80, cerniera: est}
        - {id: Porta bagno, tipo: porta, parete: P1, lato: sinistra, da_m: 4.3, larghezza_m: 0.80, cerniera: ovest}
        - {id: Porta camera 2, tipo: porta, parete: P5, lato: sinistra, da_m: 2.3, larghezza_m: 0.80, cerniera: est}
        - {id: Porta cucina, tipo: porta, parete: P2, lato: sinistra, da_m: 1.0, larghezza_m: 0.90, cerniera: nord}
        - {id: Finestra camera 2, tipo: finestra, parete: P6, lato: sinistra, da_m: 0.35, larghezza_m: 0.95, quota_davanzale_m: 0.90, altezza_m: 1.35}
        # sulle stanze rettangolari con i lati sugli assi (come nelle stanze singole: parete cardinale, `da_m` dal lato ovest o sud)
        - {id: Finestra soggiorno, tipo: finestra, stanza: Soggiorno, parete: nord, da_m: 1.2, larghezza_m: 2.4, quota_davanzale_m: 0.90, altezza_m: 1.50, ante: 2}
        - {id: Finestra cucina, tipo: finestra, stanza: Cucina, parete: nord, da_m: 1.4, larghezza_m: 1.4, quota_davanzale_m: 1.00, altezza_m: 1.30, ante: 2}
        - {id: Finestra camera 1, tipo: finestra, stanza: Camera 1, parete: ovest, da_m: 0.7, larghezza_m: 1.3, quota_davanzale_m: 0.90, altezza_m: 1.35, ante: 2}
        - {id: Finestra bagno, tipo: finestra, stanza: Bagno, parete: sud, da_m: 1.1, larghezza_m: 0.9, quota_davanzale_m: 1.20, altezza_m: 0.8, ante: 1}

      arredi:
        - {id: Letto matrimoniale, tipo: letto, x0_m: 0.45, y0_m: 0.35, dx_m: 1.6, dy_m: 2.0, testa: ovest, colore_tessuto: azzurro}
        - {id: Letto singolo, tipo: letto, x0_m: 7.1, y0_m: 0.4, dx_m: 0.95, dy_m: 1.95, testa: sud, colore_tessuto: giallo}
        - id: Piano cucina
          tipo: oggetto
          stanza: Cucina
          parete: nord
          parti:
            - {forma: scatola_parete, u0_m: 0.2, d0_m: 0.0, z0_m: 0.0, u1_m: 3.9, d1_m: 0.6, z1_m: 0.86, materiale: Laccato bianco}
            - {forma: scatola_parete, u0_m: 0.2, d0_m: 0.0, z0_m: 0.86, u1_m: 3.9, d1_m: 0.62, z1_m: 0.90, materiale: Legno chiaro}
        - id: Tavolo rotondo
          tipo: oggetto
          parti:
            - {forma: cilindro, x_m: 7.7, y_m: 4.8, z0_m: 0.72, z1_m: 0.75, raggio_m: 0.60, materiale: Legno chiaro, segmenti: 40}
            - {forma: torno, x_m: 7.7, y_m: 4.8, z0_m: 0.0, profilo_m: [[0.0, 0.0], [0.28, 0.0], [0.28, 0.03], [0.05, 0.08], [0.05, 0.72], [0.0, 0.72]], materiale: Metallo bastone}
        - id: Divano                  # contro la parete nord, sotto il davanzale (0,90 m): non blocca né porte né finestra
          tipo: oggetto
          parti:
            - {forma: smussato, p0_m: [0.5, 6.0, 0.0], p1_m: [2.9, 6.8, 0.42], raggio_m: 0.05, materiale: Tessuto azzurro}
            - {forma: smussato, p0_m: [0.5, 6.5, 0.42], p1_m: [2.9, 6.8, 0.85], raggio_m: 0.05, materiale: Tessuto azzurro}
        - id: Pilastro
          tipo: oggetto
          parti:
            - {forma: cilindro, x_m: 4.7, y_m: 6.2, z0_m: 0.0, z1_m: 2.7, raggio_m: 0.18, materiale: Intonaco pareti, segmenti: 32}
        - id: Lampada
          tipo: oggetto
          parti:
            - {forma: sfera, x_m: 3.6, y_m: 5.6, z_m: 1.6, raggio_m: 0.18, materiale: Cuscino bianco}
            - {forma: asse, da_m: [3.6, 5.6, 0.0], a_m: [3.6, 5.6, 1.45], raggio_m: 0.015, materiale: Metallo bastone}
